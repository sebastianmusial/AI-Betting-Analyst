# Aliasy drużyn (ADR 0010). Klucz = nazwa kanoniczna jak w football-data.co.uk,
# wartość = nazwy z innych źródeł (The Odds API, ręczne kursy, polscy bukmacherzy).
# Dopasowanie automatyczne: tylko dokładne (po normalizacji: małe litery, bez diakrytyków,
# bez FC/SC/SV itp.) albo przez ten plik. Skaner wypisuje niedopasowane nazwy z propozycją —
# dopisz alias tutaj po ręcznej weryfikacji. Nigdy nie zgadujemy po cichu.
#
# Poniższe wpisy to wstępne przypuszczenia — nieistniejący alias jest nieszkodliwy.

